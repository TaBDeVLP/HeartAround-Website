<body>

  <main>

    <div class="post-date" id="postDate"></div>

      <a href="index.html#board">← 게시판 목록으로</a>

      <div><b>전화</b> · <a href="tel:0313771508">031-377-1508</a></div>
      <div><b>이메일</b> · <a href="mailto:psyflex@naver.com">psyflex@naver.com</a></div>
      <div><b>운영시간</b> · 월·수·목 11:00–19:00 · 토 10:00–19:00</div>

<script>
  /* =========================================================
     개별 게시글 페이지 — Google Sheets에서 id로 글 하나를 찾아 표시
     - 주소 예: post.html?id=3  (index.html과는 완전히 다른 주소)
     - Googlebot / AI 크롤러가 글마다 별도 URL로 접근/색인할 수 있도록 함
     ========================================================= */

  // ----- 반드시 index.html과 동일한 값으로 맞춰주세요 -----
  const SHEET_ID = '1FAEszpOoT-jWIf26heNU_0aRGTq9m1kmUQEUMwgBmVA';
  const SHEET_NAME = '웹페이지';
  const API_KEY = 'AIzaSyAq5T9uK0nbz21xqe-JBATN7KophJzjlHM';
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwvC1ej2h6kjMceOskajxAzjQIOfs4lvilnrTYl8694FiAvqsqWX4J8wC3RpefVZZf1rA/exec';
  // -------------------------------------------------

  const SITE_NAME = '심리상담센터 마음을 걷는 동반자';

  async function sha256Hex(str){
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function getPostIdFromUrl(){
    const params = new URLSearchParams(window.location.search);
    const id = Number(params.get('id'));
    return Number.isFinite(id) && id > 0 ? id : null;
  }

  async function fetchAllPosts(){
    const range = encodeURIComponent(`'${SHEET_NAME}'!A2:D`);
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${range}?key=${API_KEY}`;
    const res = await fetch(url);
    if(!res.ok){
      throw new Error(`글을 불러오지 못했습니다 (HTTP ${res.status}).`);
    }
    const data = await res.json();
    const rows = data.values || [];
    return rows
      .filter(r => r[0] !== undefined && r[0] !== '')
      .map(r => ({ id: Number(r[0]), title: r[1] || '', date: r[2] || '', content: r[3] || '' }));
  }

  function applySeoTags(post){
    const title = `${post.title} | ${SITE_NAME}`;
    const desc = (post.content || '').replace(/\s+/g, ' ').trim().slice(0, 120);

    document.title = title;
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('metaDescription').setAttribute('content', desc);
    document.getElementById('ogTitle').setAttribute('content', title);
    document.getElementById('ogDescription').setAttribute('content', desc);

    // 검색엔진용 구조화 데이터(JSON-LD)
    const ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.textContent = JSON.stringify({
      '@context': 'https://schema.org',
      '@type': 'Article',
      headline: post.title,
      datePublished: post.date,
      author: { '@type': 'Organization', name: SITE_NAME },
      publisher: { '@type': 'Organization', name: SITE_NAME }
    });
    document.head.appendChild(ld);
  }

  async function renderPost(){
    const id = getPostIdFromUrl();
    const titleEl = document.getElementById('postTitle');
    const dateEl = document.getElementById('postDate');
    const contentEl = document.getElementById('postContent');
    const deleteBtn = document.getElementById('deletePostBtn');

    if(id === null){
      titleEl.textContent = '잘못된 주소입니다';
      contentEl.innerHTML = '<span class="post-state">글 번호(id)가 없는 주소입니다. 게시판 목록에서 다시 접근해 주세요.</span>';
      return;
    }

    try{
      const posts = await fetchAllPosts();
      const post = posts.find(p => p.id === id);
      if(!post){
        titleEl.textContent = '글을 찾을 수 없습니다';
        contentEl.innerHTML = '<span class="post-state">삭제되었거나 존재하지 않는 글입니다.</span>';
        return;
      }
      titleEl.textContent = post.title;
      dateEl.textContent = post.date;
      contentEl.textContent = post.content;
      applySeoTags(post);

      deleteBtn.style.display = 'inline-block';
      deleteBtn.addEventListener('click', () => handleDeleteClick(id));
    }catch(err){
      titleEl.textContent = '오류가 발생했습니다';
      contentEl.innerHTML = `<span class="post-state">${escapeHtml(err.message)}</span>`;
      console.error(err);
    }
  }

  async function handleDeleteClick(id){
    if(!confirm('이 글을 정말 삭제할까요? 되돌릴 수 없습니다.')) return;
    const password = prompt('비밀번호를 입력해 주세요.');
    if(password === null) return; // 취소
    if(!password){ alert('비밀번호를 입력해 주세요.'); return; }

    const deleteBtn = document.getElementById('deletePostBtn');
    deleteBtn.disabled = true;
    deleteBtn.textContent = '삭제 중...';
    try{
      const passwordHash = await sha256Hex(password);
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'delete', id, passwordHash })
      });
      const result = await res.json();
      if(result.result !== 'success'){
        throw new Error(result.message || '삭제에 실패했습니다.');
      }
      alert('삭제되었습니다.');
      window.location.href = 'index.html#board';
    }catch(err){
      alert('삭제 중 오류가 발생했습니다: ' + err.message);
      console.error(err);
      deleteBtn.disabled = false;
      deleteBtn.textContent = '이 글 삭제';
    }
  }

  renderPost();
</script>

</body>
